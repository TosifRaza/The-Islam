plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ikp.dev.app'
    compileSdk 34

    defaultConfig {
        // OD-01 (gate G-1): the final applicationId / branding is FROZEN only at the
        // branding & package-name freeze before Google Play submission. This
        // provisional id is for development builds only and must never be published.
        applicationId "com.ikp.dev.app"
        minSdk 24
        targetSdk 34
        versionCode 15
        versionName "0.5.6"

        // Use the live API by default so CI-built APKs work on physical devices.
        // Local development can still override this with -PIKP_BASE_URL=http://10.0.2.2:8080/.
        buildConfigField "String", "BASE_URL", "\"${project.findProperty('IKP_BASE_URL') ?: 'https://the-islam.onrender.com/'}\""

        // Supabase configuration
        buildConfigField "String", "SUPABASE_URL", "\"${project.findProperty('SUPABASE_URL') ?: 'https://svfttjrtnbzogeouovql.supabase.co/'}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${project.findProperty('SUPABASE_ANON_KEY') ?: 'sb_publishable_qMtyVLdkkIsbTlTT9tRMcw_oGuZTQQb'}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    // ---- AndroidX foundation (M3.1) ----
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // ---- MVVM: ViewModel + LiveData ----
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    // ---- Navigation Component (single-activity, 6 top-level destinations) ----
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // ---- Material Components ----
    implementation 'com.google.android.material:material:1.12.0'

    // ---- Networking (M3.7): Retrofit + OkHttp + Gson ----
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // ---- Security: Android Keystore-backed token storage ----
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // ---- Room local database (M3.8) ----
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ---- WorkManager (M3.9) ----
    implementation 'androidx.work:work-runtime:2.9.1'

    // ---- JVM unit tests ----
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    // ---- Instrumentation tests (compiled in CI; executed on device/emulator) ----
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
