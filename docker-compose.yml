# IKP development foundation — local orchestration (dev ONLY; no production
# infrastructure is deployed per the owner's standing restrictions).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ikp
      POSTGRES_USER: ikp
      POSTGRES_PASSWORD: ${IKP_DB_PASSWORD:-ikp_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikp -d ikp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      IKP_DB_URL: jdbc:postgresql://postgres:5432/ikp
      IKP_DB_USER: ikp
      IKP_DB_PASSWORD: ${IKP_DB_PASSWORD:-ikp_dev_password}
      # dev-only synthetic account seeder (never set in production)
      IKP_SEED_DEV_DATA: ${IKP_SEED_DEV_DATA:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build: ./admin
    environment:
      IKP_BACKEND_URL: http://backend:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
